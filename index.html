<div class="wrap">
  <header class="top">
    <div><h1>Move Check</h1><p class="sub">Clear pickups and trades from your own league screens.</p></div>
    <div class="sports" role="tablist" id="sports"></div>
  </header>
  <section id="upload"></section>
  <section class="moves" id="moves" aria-live="polite"></section>
  <section id="list"></section>
  <p class="note">Nothing here is a live feed. Advice follows the numbers on your screenshots, so use fresh ones. Points are counted over the rest of the season and compared with a typical free agent.</p>
</div>
<script src="engine.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const GROUPS = { mine: 'My roster', pool: 'Free agent', theirs: 'Other team' };
const mkp = (group, pos, season, recent, role, name) => ({ name: name || '', pos, season, recent, role: role || 'steady', sched: 'neutral', health: 'healthy', group, flags: [], check: false, ex: false, fromData: false });
function exampleData(sport) {
  const E = {
    fpl: [['mine', 'FWD', 6.1, 5], ['mine', 'MID', 5.2, 5.6], ['mine', 'MID', 4.4, 3.1, 'rotation'], ['mine', 'DEF', 4.9, 5.2], ['mine', 'DEF', 3.9, 3.2, 'rotation'], ['mine', 'GKP', 4, 4.1],
      ['pool', 'MID', 4.6, 6.2, 'rising'], ['pool', 'DEF', 4.4, 5.8, 'rising'], ['pool', 'FWD', 3.8, 4.2], ['pool', 'GKP', 3.9, 3.5], ['theirs', 'MID', 7.4, 7.8], ['theirs', 'FWD', 6, 6.8], ['theirs', 'DEF', 5.8, 5.2]],
    nfl: [['mine', 'QB', 18, 17], ['mine', 'RB', 14, 13], ['mine', 'RB', 9, 7, 'rotation'], ['mine', 'WR', 13.5, 11], ['mine', 'WR', 8.5, 6, 'rotation'], ['mine', 'TE', 7, 6],
      ['pool', 'RB', 8.2, 12.5, 'rising'], ['pool', 'WR', 7.8, 10.5, 'rising'], ['pool', 'TE', 5.5, 6], ['pool', 'QB', 17, 18], ['theirs', 'RB', 15, 15.5], ['theirs', 'WR', 14, 14.5], ['theirs', 'TE', 9, 9.5]],
    nba: [['mine', 'PG', 38, 36], ['mine', 'SG', 31, 33], ['mine', 'SF', 28, 26, 'rotation'], ['mine', 'PF', 30, 26, 'rotation'], ['mine', 'C', 34, 36], ['mine', 'C', 26, 24, 'rotation'],
      ['pool', 'PG', 28, 34, 'rising'], ['pool', 'SF', 27, 31, 'rising'], ['pool', 'PF', 24, 24], ['theirs', 'SG', 40, 41], ['theirs', 'C', 37, 36], ['theirs', 'SF', 33, 35]]
  }[sport];
  return E.map((r, i) => Object.assign(mkp(r[0], r[1], r[2], r[3], r[4], 'Example ' + r[1] + ' ' + String.fromCharCode(65 + i)), { ex: true }));
}
const state = { sport: 'fpl', players: {}, listOpen: false };
const MANUAL = ['fpl', 'nfl', 'nba'];
MANUAL.forEach((k) => { state.players[k] = exampleData(k); });
try { const s = JSON.parse(localStorage.getItem('movecheck3') || '{}'); if (MANUAL.indexOf(s.sport) >= 0) state.sport = s.sport; } catch (e) {}
const save = () => { try { localStorage.setItem('movecheck3', JSON.stringify({ sport: state.sport })); } catch (e) {} };
const cur = () => state.players[state.sport];
const dataSets = {};
const dataLabel = (p, dup) => (dup[p.name.toLowerCase()] > 1 && p.team ? p.name + ' (' + p.team + ')' : p.name);
async function loadData(k) {
  try {
    const r = await fetch('data/' + k + '.json', { cache: 'no-cache' }); if (!r.ok) throw new Error(r.status);
    const j = await r.json(), dup = {}, by = {}, labels = [];
    (j.players || []).forEach((p) => { if (p && p.name) { const n = String(p.name).toLowerCase(); dup[n] = (dup[n] || 0) + 1; } });
    (j.players || []).forEach((p) => {
      if (!p || !p.name || SPORTS[k].positions.indexOf(p.pos) < 0) return;
      const l = dataLabel(p, dup); by[l.toLowerCase()] = p; labels.push(l);
    });
    dataSets[k] = { fetched: String(j.fetched_at || '').slice(0, 10), count: labels.length, by, labels };
  } catch (e) { dataSets[k] = null; }
  if (k === state.sport) renderList();
}
function fillFromData(p, i) {
  const d = dataSets[state.sport], m = d && d.by[String(p.name).trim().toLowerCase()];
  if (!m) { if (p.fromData) { p.fromData = false; p.flags = []; showFlags(p, i); } return; }
  const ok = Number.isFinite(m.season), hasRecent = ok && Number.isFinite(m.recent);
  p.pos = m.pos; p.season = ok ? Math.max(0, m.season) : ''; p.recent = ok ? Math.max(0, hasRecent ? m.recent : m.season) : '';
  p.health = HEALTH[m.health] ? m.health : 'healthy'; p.role = ROLES[m.role] ? m.role : 'steady';
  p.fromData = true; p.ex = false;
  p.flags = (ok ? (hasRecent ? [] : ['No recent average in the data file. Using the season average.']) : ['No season numbers in the data file. Enter them.']).concat(m.news ? ['Data file news: ' + m.news] : []);
  ['pos', 'season', 'recent', 'health', 'role'].forEach((f) => { const el = $('r-' + state.sport + '-' + i + '-' + f); if (el) el.value = p[f]; });
  showFlags(p, i);
}
const flagsHtml = (p) => (p.flags && p.flags.length ? '<ul class="why note full" style="color:var(--warn);grid-column:1/-1">' + p.flags.map((f) => '<li>' + esc(f) + '</li>').join('') + '</ul>' : '');
function showFlags(p, i) {
  const row = $('row-' + i); if (!row) return;
  const old = row.querySelector('ul.why'); if (old) old.remove();
  row.insertAdjacentHTML('beforeend', flagsHtml(p));
}
const ctx = () => ({ G: SPORTS[state.sport].games.ros, formW: 0.4, repl: SPORTS[state.sport].repl });
const grp = (g) => cur().filter((p) => p.group === g);
const opts = (map, sel, lab) => Object.keys(map).map((k) => '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + esc(lab(map[k])) + '</option>').join('');

/* ---------- screenshot reading ---------- */
const imp = { sample: null, lim: null, files: [], urls: [], msg: ['', false], busy: false, ctl: null };
const POS_ALIAS = { GK: 'GKP', FW: 'FWD', ST: 'FWD', DF: 'DEF', MF: 'MID', PK: 'K' };
function normPos(sport, raw) {
  if (!raw) return null; let p = String(raw).trim().toUpperCase();
  if (sport === 'nfl' && (p === 'DEF' || p === 'D/ST')) p = 'DST'; else if (POS_ALIAS[p]) p = POS_ALIAS[p];
  return SPORTS[sport].positions.indexOf(p) >= 0 ? p : null;
}
function healthFrom(inj) {
  if (!inj) return { h: 'healthy', flag: '' };
  const t = String(inj).toLowerCase();
  if (/\bout\b|\bir\b|injured|susp|inactive|^o$/.test(t)) return { h: 'short', flag: 'Status "' + inj + '". Pick how long they are out.' };
  return { h: 'minor', flag: 'Status "' + inj + '". Check the status.' };
}
function normGroup(g) {
  const t = String(g || '').toLowerCase();
  if (/free|avail|waiv|wait|pool/.test(t)) return 'pool';
  if (/other|their|opp|rival|partner/.test(t)) return 'theirs';
  if (/\bmine\b|\bown\b|\bmy\b|user/.test(t)) return 'mine';
  return null;
}
function toPlayer(sport, p) {
  const flags = []; let season = Number(p.season_avg);
  if (p.season_avg == null || String(p.season_avg).trim() === '' || !(season >= 0)) {
    const tot = Number(p.season_total), gp = Number(p.games_played);
    if (p.season_total != null && p.games_played != null && tot >= 0 && gp > 0) { season = tot / gp; flags.push('Season average worked out from ' + tot + ' points over ' + gp + ' games.'); }
    else { season = ''; flags.push('Season average not shown. Enter it.'); }
  }
  let recent = Number(p.recent_avg);
  if (p.recent_avg == null || String(p.recent_avg).trim() === '' || !(recent >= 0)) { recent = season; if (season !== '') flags.push('Recent average not shown. Using the season average.'); }
  const pos = normPos(sport, p.position); if (!pos) flags.push('Position not shown. Pick one.');
  const hf = healthFrom(p.injury); if (hf.flag) flags.push(hf.flag);
  let group = normGroup(p.group); if (!group) { group = 'mine'; flags.push('Could not tell which list this player was on. Pick one.'); }
  if (p.unclear) flags.push('Hard to read in the screenshot. Check every number.');
  const r2 = (v) => (v === '' ? '' : Math.round(v * 100) / 100);
  return { name: p.name || '', pos: pos || SPORTS[sport].positions[0], season: r2(season), recent: r2(recent), role: 'steady', sched: 'neutral', health: hf.h, group, flags, check: true };
}
const IMP_ERR = {
  not_granted: 'Claude was not allowed to read screenshots here. Allow it when asked, then try again.',
  sampling_disabled: 'Reading screenshots is not available for this account.',
  image_rejected: 'One of the images could not be used. Try a PNG or JPG under 20 MB.',
  rate_limited: 'Too many reads in a short time. Wait a minute and try again.',
  invalid_json: 'Could not read those screenshots clearly. Try sharper, closer crops with fewer players.',
  empty_completion: 'Nothing readable came back. Try closer crops.', refused: 'Those images could not be read. Try different screenshots.'
};
function setMsg(t, bad) { imp.msg = [t, !!bad]; const m = $('msg'); if (m) { m.textContent = t; m.style.color = bad ? 'var(--bad)' : 'var(--mute)'; } }
function addFiles(list) {
  const ok = imp.lim.images.mediaTypes, max = imp.lim.images.maxCount;
  const picked = Array.from(list || []).filter((f) => ok.indexOf(f.type) >= 0);
  if (!picked.length) return setMsg('Use PNG, JPG, WebP or GIF screenshots.', true);
  imp.files = imp.files.concat(picked).slice(0, max);
  imp.urls.forEach((u) => URL.revokeObjectURL(u)); imp.urls = imp.files.map((f) => URL.createObjectURL(f));
  imp.msg = [imp.files.length + ' screenshot' + (imp.files.length > 1 ? 's' : '') + ' ready.', false]; renderUpload();
}
async function readShots() {
  if (imp.busy || !imp.files.length) return;
  imp.busy = true; imp.ctl = new AbortController(); setMsg('Reading your screenshots. This can take up to a minute.');
  $('go').disabled = true; $('stop').hidden = false;
  const S = SPORTS[state.sport];
  const prompt = 'You are reading screenshots from a fantasy ' + S.name + ' app. Each screenshot shows one of three things: the user’s own roster or lineup ("mine"), a list of available free agents or the waiver wire ("pool"), or another manager’s roster ("theirs"). Decide which from the screen title, team name or layout, and tag every player with it. If you cannot tell, use null. ' +
    'List every player visible. Rules: copy numbers exactly as shown, never estimate or guess; use null for anything that is not visible; do not infer role, schedule or injury length. "position" must be one of ' + S.positions.join(', ') + ', or null if not shown or ambiguous. ' +
    '"season_avg" is the average points per ' + S.per + ' for the season, only if the screenshot shows an average. Otherwise give "season_total" and "games_played" if both are shown. "recent_avg" is an average over the last few ' + S.per + 's, only if shown. ' +
    '"injury" is the status text exactly as shown (for example Q, OUT, 75% chance) or null. "unclear" is true if any value for that player was hard to read. If several screenshots show the same player in the same list, list that player once. ' +
    'Reply with only JSON in this shape: {"players":[{"name":"string","group":"mine or pool or theirs or null","position":"string or null","season_avg":0,"season_total":null,"games_played":null,"recent_avg":null,"injury":null,"unclear":false}]}';
  let done;
  try {
    const out = await imp.sample.json(prompt, { images: imp.files, cache: false, signal: imp.ctl.signal });
    const list = out && Array.isArray(out.players) ? out.players.slice(0, 40) : [];
    if (!list.length) done = ['No players found. Try closer crops of the player list.', true];
    else {
      state.players[state.sport] = list.map((p) => toPlayer(state.sport, p)); state.listOpen = true;
      const c = { mine: 0, pool: 0, theirs: 0 }; state.players[state.sport].forEach((p) => c[p.group]++);
      done = ['Found ' + c.mine + ' on your roster, ' + c.pool + ' free agents and ' + c.theirs + ' on another team. Check the list below against your screenshots.', false];
    }
  } catch (e) { done = e && e.code === 'cancelled' ? ['Stopped.', false] : [IMP_ERR[e && e.code] || 'Something went wrong while reading. Try again.', true]; }
  imp.busy = false; imp.ctl = null; imp.msg = done; renderUpload(); renderMoves(); renderList();
}

/* ---------- rendering ---------- */
function renderChrome() {
  document.body.dataset.sport = state.sport;
  $('sports').innerHTML = MANUAL.map((k) => '<button role="tab" data-sport="' + k + '" aria-selected="' + (k === state.sport) + '">' + (k === 'fpl' ? 'Premier League' : SPORTS[k].name) + '</button>').join('');
}
function renderUpload() {
  const ok = !!(imp.sample && imp.lim && imp.lim.images);
  let h = '<div class="up" data-drop="1"><h2 class="sec-h">Get your moves</h2>';
  if (!ok) { $('upload').innerHTML = h + '<p class="note">Screenshot reading is not available in this view. Add players by hand in the list below.</p></div>'; return; }
  h += '<ol class="steps"><li>Screenshot your roster.</li><li>Screenshot the free agents on your waiver wire.</li><li>Optional: screenshot another team’s roster for trade offers.</li></ol>' +
    '<label class="fld"><span>Choose, drop or paste up to ' + imp.lim.images.maxCount + ' screenshots</span><input id="file" type="file" multiple accept="' + imp.lim.images.mediaTypes.join(',') + '" data-act="file"></label>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' + imp.urls.map((u, i) => '<img src="' + u + '" alt="Screenshot ' + (i + 1) + '" style="height:64px;max-width:100%;border-radius:6px;border:1px solid var(--line)">').join('') + '</div>' +
    '<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center"><button class="go" id="go" data-act="read"' + (imp.files.length && !imp.busy ? '' : ' disabled') + '>Find my moves</button><button class="link" id="stop" data-act="stop"' + (imp.busy ? '' : ' hidden') + '>Stop</button>' + (imp.files.length && !imp.busy ? '<button class="link" data-act="clearfiles">Remove screenshots</button>' : '') + '</div>' +
    '<p class="note" id="msg" aria-live="polite" style="' + (imp.msg[1] ? 'color:var(--bad)' : '') + '">' + esc(imp.msg[0]) + '</p></div>';
  $('upload').innerHTML = h;
}
function moveCard(m) {
  return '<article class="move"><div class="mv-m"><span class="vb v-' + m.tone + '">' + esc(m.label) + '</span><span class="big">' + sgn(m.gain, 0) + ' points</span></div><h3 class="mv-t">' + esc(m.title) + '</h3><p>' + esc(m.text) + '</p></article>';
}
function renderMoves() {
  const c = ctx(), mine = grp('mine'), pool = grp('pool'), theirs = grp('theirs'), all = cur();
  const unchecked = all.filter((p) => p.check).length, missing = all.filter((p) => !(num(p.season) > 0)).length;
  const pk = pickupMoves(mine, pool, state.sport, c), tr = theirs.length ? tradeMoves(mine, theirs, state.sport, c) : [];
  let h = '<h2 class="sec-h">Your moves</h2>';
  const exN = all.filter((p) => p.ex).length;
  if (exN) h += '<div class="empty" style="border-style:solid"><b>' + (exN === all.length ? 'These use example players.' : exN + ' of these ' + all.length + ' players ' + (exN > 1 ? 'are examples' : 'is an example') + '.') + '</b> Add your screenshots above, fill them from the list below, or <button class="link" data-act="clear">clear everything</button>.</div>';
  if (unchecked) h += '<div class="empty" style="border-color:var(--warn);color:var(--warn)">' + unchecked + ' player' + (unchecked > 1 ? 's were' : ' was') + ' read from screenshots and not checked yet. A misread number changes the advice. <button class="link" data-act="checked">Mark all checked</button></div>';
  if (missing) h += '<p class="note">' + missing + ' player' + (missing > 1 ? 's are' : ' is') + ' skipped because the season average is blank or zero.</p>';
  h += '<h3 class="lbl">Pickups</h3>' + (pk.length ? '<div class="mgrid">' + pk.map(moveCard).join('') + '</div>' : '<div class="empty">' + (!mine.length || !pool.length ? 'Add your roster and the free agents to get pickup moves.' : 'No free agent clearly beats a player you already have. Hold your roster.') + '</div>');
  h += '<h3 class="lbl">Trades</h3>' + (tr.length ? '<div class="mgrid">' + tr.map(moveCard).join('') + '</div>' : '<div class="empty">' + (!theirs.length ? 'Add another team’s roster to see trade offers.' : 'No fair offer found that leaves you ahead. Try another team’s roster.') + '</div>');
  $('moves').innerHTML = h;
}
function rowHtml(p, i) {
  const S = SPORTS[state.sport], id = (f) => 'r-' + state.sport + '-' + i + '-' + f, at = (f) => ' data-i="' + i + '" data-f="' + f + '"';
  const pos = S.positions.map((x) => '<option' + (x === p.pos ? ' selected' : '') + '>' + x + '</option>').join('');
  const n = (f, l, v) => '<label class="fld"><span>' + l + '</span><input id="' + id(f) + '" type="number" inputmode="decimal" min="0" step="' + S.step + '"' + at(f) + ' value="' + v + '"></label>';
  return '<div class="prow' + (p.check ? ' chk' : '') + '" id="row-' + i + '"><label class="fld full"><span>Name</span><input id="' + id('name') + '"' + at('name') + ' list="names-' + state.sport + '" value="' + esc(p.name) + '" autocomplete="off"></label>' +
    '<label class="fld"><span>Pos</span><select id="' + id('pos') + '"' + at('pos') + '>' + pos + '</select></label>' + n('season', 'Season avg', p.season) + n('recent', 'Recent avg', p.recent) +
    '<label class="fld"><span>List</span><select id="' + id('group') + '"' + at('group') + '>' + opts(GROUPS, p.group, (v) => v) + '</select></label>' +
    '<label class="fld"><span>Status</span><select id="' + id('health') + '"' + at('health') + '>' + opts(HEALTH, p.health, (v) => v[0]) + '</select></label>' +
    '<label class="fld full"><span>Role</span><select id="' + id('role') + '"' + at('role') + '>' + opts(ROLES, p.role, (v) => v[0]) + '</select></label>' +
    '<button class="link" data-act="rm" data-i="' + i + '" aria-label="Remove player">Remove</button>' +
    flagsHtml(p) + '</div>';
}
function renderList() {
  const all = cur();
  $('list').innerHTML = '<details id="plist"' + (state.listOpen ? ' open' : '') + '><summary>Players used (' + all.length + ')</summary><div class="in"><p class="note">' + (dataSets[state.sport] ? 'Type a name and pick it from the suggestions to fill the numbers from data/' + state.sport + '.json (' + dataSets[state.sport].count + ' players, fetched ' + esc(dataSets[state.sport].fetched) + '). ' : 'No player data loaded for this sport. Open the page from a web server, not as a file, to use data/' + state.sport + '.json. ') + 'Fix any number that looks wrong. The moves update as you type.</p><datalist id="names-' + state.sport + '">' + (dataSets[state.sport] ? dataSets[state.sport].labels.map((l) => '<option value="' + esc(l) + '"></option>').join('') : '') + '</datalist><div class="moves">' +
    all.map(rowHtml).join('') + '</div><div><button class="ghost" data-act="addp">Add a player by hand</button></div></div></details>';
}
function fullRender() { renderChrome(); renderUpload(); renderMoves(); renderList(); }

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button[data-sport],[data-act]'); if (!t) return;
  if (t.dataset.sport) { state.sport = t.dataset.sport; save(); fullRender(); return; }
  switch (t.dataset.act) {
    case 'read': readShots(); break;
    case 'stop': if (imp.ctl) imp.ctl.abort(); break;
    case 'clearfiles': imp.files = []; imp.urls.forEach((u) => URL.revokeObjectURL(u)); imp.urls = []; imp.msg = ['', false]; renderUpload(); break;
    case 'addp': { const p = mkp('mine', SPORTS[state.sport].positions[0], '', ''); cur().push(p); state.listOpen = true; renderList(); renderMoves(); break; }
    case 'rm': cur().splice(+t.dataset.i, 1); state.listOpen = true; renderList(); renderMoves(); break;
    case 'clear': state.players[state.sport] = []; renderMoves(); renderList(); break;
    case 'checked': cur().forEach((p) => { p.check = false; }); renderMoves(); renderList(); break;
  }
});
function onEdit(e) {
  const t = e.target;
  if (t.dataset.act === 'file') { if (e.type === 'change' && t.files && t.files.length) { addFiles(t.files); t.value = ''; } return; }
  if (!t.dataset.f) return;
  const p = cur()[+t.dataset.i]; if (!p) return;
  p[t.dataset.f] = t.value;
  if (t.dataset.f === 'name') { if (p.ex) p.ex = false; fillFromData(p, +t.dataset.i); }
  if (p.check) { p.check = false; const r = $('row-' + t.dataset.i); if (r) r.classList.remove('chk'); }
  renderMoves();
}
document.addEventListener('input', onEdit); document.addEventListener('change', onEdit);
document.addEventListener('toggle', (e) => { if (e.target.id === 'plist') state.listOpen = e.target.open; }, true);
document.addEventListener('dragover', (e) => { if (imp.lim && e.target.closest && e.target.closest('[data-drop]')) e.preventDefault(); });
document.addEventListener('drop', (e) => { if (imp.lim && e.target.closest && e.target.closest('[data-drop]')) { e.preventDefault(); addFiles(e.dataTransfer && e.dataTransfer.files); } });
document.addEventListener('paste', (e) => { const f = Array.from((e.clipboardData && e.clipboardData.files) || []); if (f.length && imp.lim && imp.lim.images) addFiles(f); });
fullRender();
MANUAL.forEach(loadData);
(async function () {
  try { if (window.claude && window.claude.use) imp.sample = await window.claude.use('sample'); if (imp.sample) imp.lim = await imp.sample.limits().catch(() => null); } catch (e) { imp.sample = null; }
  if (imp.sample && imp.lim && imp.lim.images && !imp.busy) renderUpload();
})();
</script>
